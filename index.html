<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Floor House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold: #e9b46a; --ink: #f4ead8; --panel: rgba(14, 12, 10, 0.55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a09; color: var(--ink); font-family: Outfit, system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  body.locked canvas { cursor: none; }

  #intro { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(12,10,8,.35), rgba(8,7,6,.85)); transition: opacity .8s; z-index: 5; }
  body.started #intro { opacity: 0; pointer-events: none; }
  .card { text-align: center; max-width: 460px; padding: 0 16px; }
  .card h1 { font-weight: 300; font-size: clamp(30px, 6vw, 46px); letter-spacing: .02em; margin: 0 0 8px; }
  .card h1 b { color: var(--gold); font-weight: 400; }
  .card p { opacity: .75; font-weight: 300; line-height: 1.55; margin: 0 0 26px; }
  #enter { font: inherit; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: #1a1209; background: var(--gold); border: 0; border-radius: 999px; padding: 13px 34px; cursor: pointer; opacity: .35; pointer-events: none; transition: opacity .4s, transform .2s; }
  body.ready #enter { opacity: 1; pointer-events: auto; }
  #enter:hover { transform: scale(1.04); }
  #loading-text { margin-top: 16px; font-size: 13px; opacity: .6; }
  body.ready #loading-text { visibility: hidden; }

  #hud { position: fixed; left: 16px; bottom: 16px; width: 270px; padding: 14px 16px 12px; background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,230,190,.12); border-radius: 14px; font-size: 13px; z-index: 3; transition: opacity .4s; }
  body.hide-ui #hud, body.hide-ui #keys { opacity: 0; pointer-events: none; }
  .row { display: grid; grid-template-columns: 82px 1fr 64px; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { color: var(--gold); }
  .row output { text-align: right; opacity: .8; font-variant-numeric: tabular-nums; font-size: 12px; }
  .row.time { grid-template-columns: 1fr; gap: 4px; }
  .row.time .top { display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; accent-color: var(--gold); height: 18px; }
  #play { width: 100%; margin-top: 6px; font: inherit; color: var(--ink); background: rgba(233,180,106,.14); border: 1px solid rgba(233,180,106,.35); border-radius: 8px; padding: 7px; cursor: pointer; }
  .spots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
  .spots button { font: inherit; font-size: 11.5px; color: var(--ink); background: rgba(255,255,255,.06); border: 1px solid rgba(255,230,190,.14); border-radius: 7px; padding: 5px 2px; cursor: pointer; }
  .spots button:hover { background: rgba(233,180,106,.22); }
  #play:hover { background: rgba(233,180,106,.25); }
  #keys { position: fixed; right: 16px; top: 16px; font-size: 12px; opacity: .7; text-align: right; line-height: 1.7; z-index: 3; transition: opacity .4s; }
  kbd { font-family: inherit; border: 1px solid rgba(255,255,255,.3); border-radius: 4px; padding: 0 5px; }
  @media (max-width: 600px) { #hud { width: auto; right: 16px; } #keys { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="intro"><div class="card">
  <h1>First Floor <b>House</b></h1>
  <p>Your 1st floor plan, built in Blender and lit in real time: hall, three bedrooms, two washrooms and the big open court with no roof. Walk through it while the sun crosses the sky.</p>
  <button id="enter">Step inside</button>
  <div id="loading-text">Starting…</div>
</div></div>

<div id="keys"><kbd>W A S D</kbd> walk · <kbd>Shift</kbd> run · mouse look<br><kbd>T</kbd> play/pause sun · <kbd>H</kbd> hide UI · <kbd>Esc</kbd> release mouse</div>

<div id="hud">
  <div class="row time"><div class="top"><label for="time">Time of day</label><output id="time-v"></output></div>
    <input id="time" type="range" min="0" max="1" step="0.001"></div>
  <div class="row"><label for="rays">God rays</label><input id="rays" type="range" min="0" max="2.5" step="0.01"><output id="rays-v"></output></div>
  <div class="row"><label for="dust">Dust</label><input id="dust" type="range" min="0" max="2.5" step="0.01"><output id="dust-v"></output></div>
  <div class="row"><label for="aperture">Aperture</label><input id="aperture" type="range" min="0" max="30" step="0.1"><output id="aperture-v"></output></div>
  <div class="row"><label for="mblur">Motion blur</label><input id="mblur" type="range" min="0" max="2" step="0.01"><output id="mblur-v"></output></div>
  <div class="row"><label for="vignette">Vignette</label><input id="vignette" type="range" min="0" max="1" step="0.01"><output id="vignette-v"></output></div>
  <button id="play">Pause sun</button>
  <div class="spots"><button data-spot="court">Open court</button><button data-spot="hall">Hall</button><button data-spot="room1">Room 1</button><button data-spot="room2">Room 2</button><button data-spot="room3">Room 3</button><button data-spot="wash">Washing area</button></div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
